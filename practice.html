<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wind Shifts | San Juan Academy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />


  <!-- STEP 1: Load Core Map Engines & Global Variables First -->
  <script src="js/globalSimulationData.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
 
  <!-- STEP 2: Load Your Core Simulator Engine Layouts -->
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/ilcaHandleControls.js"></script>
  <script type="module" src="js/ilcaMap.js"></script>

  <!-- 2. Your Personal Custom CSS Last (Overrides everything above safely) -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="manifest" href="favicon/site.webmanifest">
  <meta name="viewport" content="width=device-width, initial-scale=.5, user-scalable=no">
</head>

  <div style="background-color: var(--nav-bg); color: var(--text-color); padding: 1rem; border-radius: 4px;">
    <h2>San Juan Academy</h2>
  </div>

  <section>
    <div id="map">
    </div>
    <!-- Live Value Telemetry Grid Block -->
    <div id="telemetryDiv" style="display: flex; flex-direction: column; gap: 4px; ">
      <div style="display: flex; justify-content: space-between;">
        <span>Boom Angle:</span>
        <span><span id="boomAngleDisplay">15.0</span>°</span>
      </div>
      <div id="controlsDiv" style="flex: 3; display: flex; flex-direction: column; gap: 8px;">
        
        <!-- Sheet controls row -->
        <div id="sheetDiv" class="control-row" style="display: flex; flex: 1; align-items: stretch;">
          <button class="control-button" onclick="handleSheetIn()" style="flex: 1; height: 100%;">SHEET IN</button>
          <button class="control-button" onclick="handleSheetOut()" style="flex: 1; height: 100%;">SHEET OUT</button>
        </div>

        <!-- 🛠️ FIXED WHEELHOUSE: Assigned correct maneuver tags and nested within controlsDiv -->
        <div id="headingDiv" class="control-row" style="display: flex; flex: 1; align-items: stretch;">
          <button class="control-button" onclick="window.globalSimulationData.ILCA.maneuver = 'bear-away'" style="flex: 1; height: 100%;">BEAR AWAY</button>
          <button class="control-button" onclick="window.globalSimulationData.ILCA.maneuver = 'head-up'" style="flex: 1; height: 100%;">HEAD UP</button>
        </div>

        <!-- Steering / Tacking controls row -->
        <div id="tackDiv" class="control-row" style="display: flex; flex: 1; align-items: stretch;">
          <button class="control-button" onclick="window.globalSimulationData.ILCA.maneuver = 'tack'" style="flex: 1; height: 100%;">TACK</button>
        </div>

      </div>
    </div>
  </section>
  
  <div class="control-row" style="position: fixed; top: 50%; left: 50%; transform: translateX(-50%); z-index: 9999;">
      <button id="startExamBtn">Start</button>
  </div>



  <script>
    // Map start simulation button logic
    const startExamBtn = document.getElementById('startExamBtn');
      if (startExamBtn) {
        startExamBtn.addEventListener('click', () => {
          launchSimulation();
          startExamBtn.style.display = 'none';
       });
    }
  </script>

  <script>
    // Map start simulation button logic
    const mapStartSimulationBtn = document.getElementById('mapStartSimulationBtn');
    if (mapStartSimulationBtn) {
        mapStartSimulationBtn.addEventListener('click', () => {
          launchSimulation();
          mapStartSimulationBtn.style.display = 'none';
        });
    }
  </script>

  <script>
    // Inside your main input/state loop processing button clicks:
    const ANGLE_STEP = 1.5; // Smooth 1.5 degree changes per click for precise trim

    function handleSheetIn() {
      // Get the current angle from global scope before performing the math subtraction
      const currentAngle = parseFloat(window.globalSimulationData.ILCA.boomAngle) || 0.0;
      
      // Pulls the boom closer to the boat center line (Min limit 0 degrees)
      window.globalSimulationData.ILCA.boomAngle = Math.max(0.0, currentAngle - ANGLE_STEP);
    }

    function handleSheetOut() {
      // Get the current angle from global scope before performing the math addition
      const currentAngle = parseFloat(window.globalSimulationData.ILCA.boomAngle) || 0.0;
      
      // Lets the boom swing out wider (Max limit 90 degrees square)
      window.globalSimulationData.ILCA.boomAngle = Math.min(90.0, currentAngle + ANGLE_STEP);
    }
  </script>

  <script>


    function handleSheetIn() {
    const currentAngle = parseFloat(window.globalSimulationData.ILCA.boomAngle) || 0.0;
    const newAngle = Math.max(0.0, currentAngle - ANGLE_STEP);
    
    // Save to global data
    window.globalSimulationData.ILCA.boomAngle = newAngle;
    
    // Push the change to the screen text label
    document.getElementById('boomAngleDisplay').innerText = newAngle.toFixed(1);
  }

  function handleSheetOut() {
    const currentAngle = parseFloat(window.globalSimulationData.ILCA.boomAngle) || 0.0;
    const newAngle = Math.min(90.0, currentAngle + ANGLE_STEP);
    
    // Save to global data
    window.globalSimulationData.ILCA.boomAngle = newAngle;
    
    // Push the change to the screen text label
    document.getElementById('boomAngleDisplay').innerText = newAngle.toFixed(1);
  }
  </script>

  <div style="
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%); /* Centered vertically and horizontally */
      pointer-events: none;
      font-family: system-ui, -apple-system, sans-serif;
      min-width: 250px;
      text-align: center; /* 🎯 FIX: Centers the text inside the 250px box */
  ">
      <h2 style="
          margin: 0;
          padding: 0;
          font-size: 1.3rem;
          font-weight: 700;
          color: #198754;
      ">Stage 2 — Practice</h2>
  </div>

  <footer class="border-top mt-5 py-1">
      <div class="container text-center">
          <p class="mb-1">
              <strong>Dinghy Sailing Tutorial</strong>
          </p>
          <small class="text-body-secondary">
              Learn • Practice • Challenge
          </small>
      </div>
  </footer>
  <script src="js/practice.js"></script>
</html>
