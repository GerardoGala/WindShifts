<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=0.5, user-scalable=no">

  <title>Wind Shifts | San Juan Academy</title>

  <!-- Bootstrap -->

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Material Icons -->

  <link
    href="https://fonts.googleapis.com/icon?family=Material+Icons"
    rel="stylesheet">

  <!-- Leaflet -->

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css">

  <!-- Custom CSS -->

  <link rel="stylesheet" href="css/style.css">

  <!-- Favicon -->

  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="manifest" href="favicon/site.webmanifest">

  <!-- Core Simulation Data -->

  <script src="js/globalSimulationData.js"></script>

  <!-- Leaflet -->

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <!-- Simulator -->

  <script type="module" src="js/app.js"></script>

  <script type="module" src="js/ilcaHandleControls.js"></script>

  <script type="module" src="js/ilcaMap.js"></script>

</head>

<body>

  <!-- San Juan Academy Header -->

  <div style="
    background-color: var(--nav-bg);
    color: var(--text-color);
    padding: 1rem;
    border-radius: 4px;
  ">
    <h2>San Juan Academy</h2>
  </div>

  <!-- Simulation Area -->

  <section>


<div id="map"></div>

<div
  id="divStart"
  class="mt-3 d-flex flex-column align-items-center justify-content-start w-100">

  <!-- Start Button -->
  <button
    id="startButton"
    type="button"
    class="btn btn-success btn-lg px-5 mb-3">
    Start
  </button>

  <!-- Back Button -->
  <a
    href="index.html"
    id="backButton"
    class="btn btn-primary btn-lg px-5 mb-3 w-100 d-none">
    Back to Main Menu
  </a>

</div>


  </section>

  <!-- Floating Learn Indicator -->

  <div style="
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-40%, -50%);
    pointer-events: none;
    font-family: system-ui, -apple-system, sans-serif;
    min-width: 250px;
    text-align: center;
  ">

<h2 style="
  margin: 0;
  padding: 0;
  font-size: 1.3rem;
  font-weight: 700;
  color: #0d6efd;
">
  Learn
</h2>


  </div>

  <!-- Footer -->

  <footer class="border-top mt-5 py-1">


<div class="container text-center">

  <p class="mb-1">
    <strong>Dinghy Sailing Tutorial</strong>
  </p>

  <small class="text-body-secondary">
    Learn • Practice • Challenge
  </small>

</div>


  </footer>

  <!-- Start Button Logic -->

  <script>

    const startButton = document.getElementById('startButton');
    const backButton = document.getElementById('backButton');

    startButton.addEventListener('click', function () {

      launchSimulation();

      startButton.classList.add('d-none');
      backButton.classList.remove('d-none');

    });

  </script>

</body>
</html>
