<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Windshift | San Juan Academy</title>
  <meta name="viewport" content="width=device-width, initial-scale=.5, user-scalable=no">

  <!-- 1. External Framework First (Loaded from fast global CDN servers) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- STEP 1: Load Core Map Engines & Global Variables First -->
  <script src="js/globalSimulationData.js"></script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
 
  <!-- STEP 2: Load Your Core Simulator Engine Layouts -->
  <script type="module" src="js/app.js"></script>
  <script type="module" src="js/ilcaHandleControls.js"></script>
  <script type="module" src="js/ilcaMap.js"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="css/challenge.css">

  <!-- 4. Your Personal Custom CSS Last (Overrides everything above safely) -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <link rel="manifest" href="favicon/site.webmanifest">
</head>

<body>
  <div id="header-placeholder"></div>
  <section>
    <div id="map" >
    </div>

  <!-- Simulation Area -->
  <section>



    <div
      id="divStart"
      class="mt-3 d-flex flex-column align-items-center justify-content-start w-100">

      <!-- Start Button -->
      <button
        id="startButton"
        type="button"
        class="btn btn-success btn-lg px-5 mb-3">
        Start
      </button>

      <!-- Back Button -->
      <a
        href="index.html"
        id="backButton"
        class="btn btn-primary btn-lg px-5 mb-3 w-100 d-none">
        Back to Main Menu
      </a>

    </div>


  </section>

  <!-- Floating Learn Indicator -->
  <div style="
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-40%, -50%);
    pointer-events: none;
    font-family: system-ui, -apple-system, sans-serif;
    min-width: 250px;
    text-align: center;
  ">

<h2 style="
  margin: 0;
  padding: 0;
  font-size: 1.3rem;
  font-weight: 700;
  color: #0d6efd;
">
  Learn
</h2>


  </div>

  <!-- Start Button Logic -->
  <script>
    const startButton = document.getElementById('startButton');
    const backButton = document.getElementById('backButton');
    startButton.addEventListener('click', function () {
      launchSimulation();
      startButton.classList.add('d-none');
      backButton.classList.remove('d-none');
    });
  </script>

  <div id="footer-placeholder"></div>

    <script src="js/layout.js"></script>
    <!-- Load your calculations script last -->
    <script src="js/challenge.js"></script>
</body>
</html>
